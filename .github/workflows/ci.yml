# Public repo: runs on fork PRs with a read-only token and no secrets. Never switch this to
# pull_request_target. Third-party actions are pinned to commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-linux"
      # Build as the runner user: root has no rustup here.
      - run: cargo build
        env:
          CARGO_TARGET_DIR: target-linux
      - run: sudo SKIP_BUILD=1 sh scripts/linux-netns-test.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: sh scripts/build-macos-bar.sh
      - run: target/MultilinkBar.app/Contents/MacOS/MultilinkBar --selftest

  # Compile check only: running needs admin and wintun.dll.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release
      - run: cargo clippy -- -D warnings
