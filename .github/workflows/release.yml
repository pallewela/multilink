# Publish a GitHub release with the macOS app. Tags containing a hyphen are marked pre-release.
# Either push a tag whose version is already in Cargo.toml (git tag v0.1.0-alpha.6 && git push
# origin v0.1.0-alpha.6), or run this workflow on main, which bumps the version itself:
#   gh workflow run release.yml --ref main                  # least significant number: alpha.5 -> alpha.6, 1.2.3 -> 1.2.4
#   gh workflow run release.yml --ref main -f version=0.2.0 # or an explicit version
# A run from main commits "Prepare X" straight to main, so it needs a RELEASE_TOKEN secret: a
# fine-grained PAT (Contents: read/write on this repo) owned by a repo admin. main is protected
# but not enforced for admins, so the push bypasses the PR and status-check rules.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (default: bump the least significant number)"
        required: false

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          cur=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$cur" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$cur"; exit 1; }
            echo "TAG=v$cur" >> "$GITHUB_ENV"
            exit 0
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run this workflow on main"; exit 1; }
          if [ -n "$INPUT" ]; then
            new=${INPUT#v}
          else
            case $cur in
              *-*) n=${cur##*[!0-9]}
                   [ -n "$n" ] || { echo "no trailing number in $cur: pass a version"; exit 1; }
                   new=${cur%"$n"}$((n + 1)) ;;
              *)   new=${cur%.*}.$((${cur##*.} + 1)) ;;
            esac
          fi
          echo "$new" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad version: $new"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null && { echo "tag v$new already exists"; exit 1; }
          awk -v v="$new" '!d && /^version = / { print "version = \"" v "\""; d=1; next } { print }' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          echo "TAG=v$new" >> "$GITHUB_ENV"
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: sh scripts/build-macos-app.sh
      - run: target/Multilink.app/Contents/MacOS/Multilink --selftest
      - name: Package
        id: package
        run: |
          dmg="Multilink-${TAG#v}-macos.dmg"
          mkdir dmg
          cp -R target/Multilink.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Multilink -srcfolder dmg -fs HFS+ -format UDZO "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "sha256=$(cut -d" " -f1 "$dmg.sha256")" >> "$GITHUB_OUTPUT"
      - name: Commit the version bump to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Prepare ${TAG#v}"
          git push origin HEAD:main
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "$TAG" in *-*) flag="--prerelease" ;; esac
          gh release create "$TAG" $flag --target "$(git rev-parse HEAD)" --generate-notes \
            --title "$TAG" Multilink-*-macos.dmg Multilink-*-macos.dmg.sha256
      - name: Bump Homebrew tap cask
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.TAP_REPO_TOKEN }}
          repository: pallewela/homebrew-tap
          event-type: multilink-release
          client-payload: |
            {"tag": "${{ env.TAG }}", "sha256": "${{ steps.package.outputs.sha256 }}"}
