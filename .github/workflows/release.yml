# Tag a version (git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1) to publish a
# GitHub release with the macOS app. Tags containing a hyphen are marked pre-release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match Cargo.toml version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: sh scripts/build-macos-app.sh
      - run: target/Multilink.app/Contents/MacOS/Multilink --selftest
      - name: Package
        id: package
        run: |
          dmg="Multilink-${GITHUB_REF_NAME#v}-macos.dmg"
          mkdir dmg
          cp -R target/Multilink.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Multilink -srcfolder dmg -fs HFS+ -format UDZO "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "sha256=$(cut -d" " -f1 "$dmg.sha256")" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flag --generate-notes \
            --title "$GITHUB_REF_NAME" Multilink-*-macos.dmg Multilink-*-macos.dmg.sha256
      - name: Bump Homebrew tap cask
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.TAP_REPO_TOKEN }}
          repository: pallewela/homebrew-tap
          event-type: multilink-release
          client-payload: |
            {"tag": "${{ github.ref_name }}", "sha256": "${{ steps.package.outputs.sha256 }}"}
