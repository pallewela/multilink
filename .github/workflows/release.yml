# Tag a version (git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1) to publish a
# GitHub release with the macOS app. Tags containing a hyphen are marked pre-release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match Cargo.toml version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: sh scripts/build-macos-bar.sh
      - run: target/MultilinkBar.app/Contents/MacOS/MultilinkBar --selftest
      - name: Package
        run: |
          zip="MultilinkBar-${GITHUB_REF_NAME#v}-macos.zip"
          ditto -c -k --keepParent target/MultilinkBar.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flag --generate-notes \
            --title "$GITHUB_REF_NAME" MultilinkBar-*-macos.zip MultilinkBar-*-macos.zip.sha256
